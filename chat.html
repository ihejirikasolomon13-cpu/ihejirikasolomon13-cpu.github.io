
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SoloBest Super Chat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:#111b21;color:#fff;height:100vh;display:flex;flex-direction:column}
header{background:#202c33;padding:12px;display:flex;justify-content:space-between;align-items:center}
header b{color:#25d366}
#online{font-size:12px;color:#25d366}
#msgs{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px;background:#0b141a url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png')}
.m{padding:7px 10px;border-radius:8px;max-width:75%;font-size:14px;position:relative;background:#202c33;align-self:flex-start}
.m.me{background:#005c4b;align-self:flex-end}
.m img{max-width:180px;border-radius:8px;margin-top:4px;display:block}
.m small{font-size:10px;color:#8696a0;display:block;margin-top:2px}
.m .del{position:absolute;top:2px;right:4px;font-size:10px;color:#f00;cursor:pointer}
#bar{display:flex;padding:8px;gap:6px;background:#202c33;align-items:center}
#bar input[type=text]{flex:1;padding:12px;border-radius:20px;border:none;outline:none;background:#2a3942;color:#fff}
#bar button{padding:10px 14px;border-radius:50%;border:none;background:#25d366;color:#fff;font-size:18px}
#nameBar{background:#111b21;padding:6px;text-align:center;font-size:13px}
#nameBar input{padding:4px 8px;border-radius:10px;border:none;background:#202c33;color:#fff;text-align:center}
</style>
<script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
</head>
<body>
<header><div><b>💬 SoloBest Chat</b><div id="online">● 1 Online</div></div><div style="font-size:11px">Light & Fast 🇳🇬</div></header>
<div id="nameBar">Your name: <input id="myName" value="Solomon" maxlength="12"></div>
<div id="msgs"></div>
<div id="bar">
<label style="font-size:22px;cursor:pointer">📷<input type="file" id="pic" accept="image/*" hidden></label>
<input id="inp" type="text" placeholder="Type a message">
<button onclick="send()">➤</button>
</div>
<script>
const gun=Gun(['https://gun-manhattan.herokuapp.com/gun']);
const chat=gun.get('solobest-super-v2');
const msgsDiv=document.getElementById('msgs');
const inp=document.getElementById('inp');
const myName=document.getElementById('myName');
let online=1;
chat.map().on((d,id)=>{
 if(!d||!d.t&&!d.img) return;
 if(document.getElementById(id)) return;
 let el=document.createElement('div');
 el.id=id; el.className='m'+(d.n===myName.value?' me':'');
 let imgPart=d.img?`<img src="${d.img}">`:'';
 el.innerHTML=`<span class="del" onclick="delMsg('${id}')">✕</span><b style="font-size:11px;color:#53bdeb">${d.n}</b><div>${d.t||''}</div>${imgPart}<small>${new Date(d.time).toLocaleTimeString()}</small>`;
 msgsDiv.appendChild(el);
 msgsDiv.scrollTop=msgsDiv.scrollHeight;
});
function send(){
 let t=inp.value.trim(); if(!t&&!window._img) return;
 chat.set({n:myName.value||'Anon',t:t,img:window._img||'',time:Date.now()});
 inp.value=''; window._img=''; 
}
function delMsg(id){ document.getElementById(id)?.remove(); chat.get(id).put(null); }
document.getElementById('pic').onchange=e=>{
 let f=e.target.files[0]; if(!f) return;
 let r=new FileReader(); r.onload=()=>{window._img=r.result; send();}; r.readAsDataURL(f);
};
inp.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
// online fake counter
setInterval(()=>{document.getElementById('online').innerText=`● ${Math.floor(1+Math.random()*5)} Online`;},3000);
</script>
</body>
</html>
