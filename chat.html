
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SoloBest Chat - Light</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:#0f172a;color:#fff;display:flex;flex-direction:column;height:100vh}
header{background:#1e293b;padding:12px;text-align:center;font-weight:700;color:#38bdf8}
#msgs{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.msg{background:#1e293b;padding:8px 12px;border-radius:12px;max-width:80%;font-size:14px}
.msg.me{background:#0ea5e9;align-self:flex-end}
#bar{display:flex;padding:10px;gap:8px;background:#1e293b}
#inp{flex:1;padding:10px;border-radius:20px;border:none;outline:none}
button{padding:10px 18px;border-radius:20px;border:none;background:#0ea5e9;color:#fff;font-weight:700}
#nameBar{padding:8px;background:#020617;text-align:center}
#nameBar input{padding:6px;border-radius:8px;border:none;text-align:center}
</style>
<script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
</head>
<body>
<header>⚡ SoloBest Light Chat - 0 Data Waste</header>
<div id="nameBar">Name: <input id="myName" value="Boss" maxlength="12"></div>
<div id="msgs"></div>
<div id="bar">
<input id="inp" placeholder="Type message...">
<button onclick="send()">Send</button>
</div>
<script>
const gun = Gun(['https://gun-manhattan.herokuapp.com/gun']);
const chat = gun.get('solobest-chat-v1-2026');
const msgsDiv = document.getElementById('msgs');
const inp = document.getElementById('inp');
const myName = document.getElementById('myName');

chat.map().on((data,id)=>{
 if(!data||!data.t) return;
 if(document.getElementById(id)) return;
 let div=document.createElement('div');
 div.id=id;
 div.className='msg'+(data.n===myName.value?' me':'');
 div.innerHTML=`<b style="font-size:11px;color:#7dd3fc">${data.n}</b><br>${data.t}`;
 msgsDiv.appendChild(div);
 msgsDiv.scrollTop=msgsDiv.scrollHeight;
});

function send(){
 let t=inp.value.trim(); if(!t) return;
 chat.set({n:myName.value||'Anon',t:t,time:Date.now()});
 inp.value='';
}
inp.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
</script>
</body>
</html>
