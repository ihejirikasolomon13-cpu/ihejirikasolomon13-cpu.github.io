
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>WhatsApp - SoloBest</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,Segoe UI;background:#fff;height:100vh;display:flex;flex-direction:column}
.h{padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.h b{color:#128c7e;font-size:22px}
.h span{font-size:22px}
.search{margin:6px 12px;background:#f0f2f5;padding:10px 14px;border-radius:24px;display:flex;gap:10px;align-items:center;color:#667781}
.search input{border:none;background:transparent;outline:none;width:100%;font-size:15px}
.tabs{padding:8px 12px;display:flex;gap:8px;overflow-x:auto;white-space:nowrap}
.tabs div{padding:6px 14px;border-radius:18px;background:#f0f2f5;font-size:14px;color:#54656f}
.tabs div.active{background:#d9fdd3;color:#128c7e;font-weight:600}
.chats{flex:1;overflow-y:auto}
.chat-item{display:flex;gap:12px;padding:12px;border-bottom:1px solid #f0f2f5;align-items:center}
.chat-item img{width:50px;height:50px;border-radius:50%;object-fit:cover;background:#e9edef}
.chat-item .info{flex:1}
.chat-item .top{display:flex;justify-content:space-between}
.chat-item .name{font-weight:600;font-size:16px}
.chat-item .time{font-size:12px;color:#667781}
.chat-item .last{font-size:14px;color:#667781;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:200px}
.add{position:fixed;bottom:80px;right:20px;width:56px;height:56px;background:#25d366;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;box-shadow:0 4px 10px rgba(0,0,0,.2);cursor:pointer}
.bottom{height:60px;display:flex;justify-content:space-around;align-items:center;border-top:1px solid #f0f2f5;background:#fff;padding-bottom:5px}
.bottom div{text-align:center;font-size:11px;color:#667781}
.bottom div.active{color:#128c7e}
.bottom i{font-size:22px;display:block}
/* chat window */
#win{position:fixed;inset:0;background:#e5ddd5;display:none;flex-direction:column;z-index:10}
#win header{background:#008069;padding:12px;display:flex;gap:10px;align-items:center;color:#fff}
#win #msgs{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px;background:#0b141a url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png')}
.bubble{background:#fff;padding:8px 10px;border-radius:8px;max-width:75%;font-size:14px;align-self:flex-start}
.bubble.me{background:#d9fdd3;align-self:flex-end}
#win #bar{display:flex;padding:8px;gap:8px;background:#f0f2f5;align-items:center}
#win input{flex:1;padding:12px;border-radius:24px;border:none;outline:none}
#win button{background:#25d366;border:none;width:44px;height:44px;border-radius:50%;color:#fff;font-size:20px}
</style>
</head>
<body>
<div class="h"><b>WhatsApp</b><span>⋮</span></div>
<div class="search">🔍 <input id="s" placeholder="Ask Meta AI or Search" oninput="filter()"></div>
<div class="tabs"><div class="active">All</div><div>Unread</div><div>Favorites</div><div>Groups</div><div>+</div></div>
<div class="chats" id="list"></div>
<div class="add" onclick="addContact()">+</div>
<div class="bottom">
<div class="active"><i>💬</i>Chats</div><div><i>⭕</i>Updates</div><div><i>👥</i>Communities</div><div><i>📞</i>Calls</div><div><i>👤</i>You</div>
</div>

<div id="win">
<header><span onclick="closeWin()" style="font-size:24px">←</span><img id="wImg" style="width:36px;height:36px;border-radius:50%"><div><div id="wName" style="font-weight:600"></div><div style="font-size:12px;opacity:.8">tap here for contact info</div></div></header>
<div id="msgs"></div>
<div id="bar"><input id="inp" placeholder="Message"><button onclick="send()">➤</button></div>
</div>

<script>
let contacts = JSON.parse(localStorage.getItem('sb_contacts')||'[]');
if(contacts.length==0){
 contacts=[
  {name:'Amod',last:'Voice message (0:05)',time:'3:57 PM',img:'https://i.pravatar.cc/100?u=amod'},
  {name:'Brilliant ones',last:'Accept my invite & Win...',time:'3:20 PM',img:'https://i.pravatar.cc/100?u=brill'},
  {name:'School love 🌹',last:'APC Instant N40,000 Naira...',time:'12:01 PM',img:'https://i.pravatar.cc/100?u=school'},
  {name:'Monday James',last:'Just say am finished',time:'11:20 AM',img:'https://i.pravatar.cc/100?u=monday'},
  {name:'Mummy Prince',last:'Shabe I say I go pay you back',time:'9:10 AM',img:'https://i.pravatar.cc/100?u=mummy'}
 ];
 save();
}
let current=null;
let messages = JSON.parse(localStorage.getItem('sb_msgs')||'{}');

function save(){localStorage.setItem('sb_contacts',JSON.stringify(contacts)); localStorage.setItem('sb_msgs',JSON.stringify(messages)); render();}
function render(){
 let q=document.getElementById('s').value.toLowerCase();
 let html='';
 contacts.filter(c=>c.name.toLowerCase().includes(q)).forEach((c,i)=>{
  html+=`<div class="chat-item" onclick="openChat(${i})"><img src="${c.img}"><div class="info"><div class="top"><div class="name">${c.name}</div><div class="time">${c.time}</div></div><div class="last">${c.last}</div></div></div>`;
 });
 document.getElementById('list').innerHTML=html;
}
function filter(){render();}
function addContact(){
 let name=prompt('Contact name? Eg: Solomon');
 if(!name) return;
 let last=prompt('Last message?')||'Hi Boss!';
 let img=`https://i.pravatar.cc/100?u=${name.replace(/\s/g,'')}${Date.now()}`;
 contacts.unshift({name,last,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),img});
 messages[name]=[];
 save();
}
function openChat(i){
 current=contacts[i].name;
 document.getElementById('wName').innerText=current;
 document.getElementById('wImg').src=contacts[i].img;
 document.getElementById('win').style.display='flex';
 renderMsgs();
}
function closeWin(){document.getElementById('win').style.display='none';}
function renderMsgs(){
 let box=document.getElementById('msgs'); box.innerHTML='';
 (messages[current]||[]).forEach(m=>{
  let d=document.createElement('div'); d.className='bubble'+(m.me?' me':''); d.innerText=m.t; box.appendChild(d);
 });
 box.scrollTop=box.scrollHeight;
}
function send(){
 let inp=document.getElementById('inp'); let t=inp.value.trim(); if(!t||!current) return;
 if(!messages[current]) messages[current]=[];
 messages[current].push({t,me:true});
 // auto reply
 setTimeout(()=>{messages[current].push({t:'Received: '+t,me:false}); save(); renderMsgs();},800);
 contacts.find(c=>c.name===current).last=t;
 contacts.find(c=>c.name===current).time='now';
 inp.value=''; save(); renderMsgs(); render();
}
render();
</script>
</body>
</html>
