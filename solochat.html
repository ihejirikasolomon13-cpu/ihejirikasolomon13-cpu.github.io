
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>SoloChat - By Solomon</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,Segoe UI;background:#fff;height:100vh;display:flex;flex-direction:column}
.h{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;background:#075e54}
.h b{color:#fff;font-size:24px;letter-spacing:.5px}
.search{margin:8px 12px;background:#f0f2f5;padding:12px 16px;border-radius:24px;display:flex;gap:10px;align-items:center}
.search input{border:none;background:transparent;outline:none;width:100%;font-size:15px}
.tabs{padding:8px 12px;display:flex;gap:8px;overflow-x:auto;background:#075e54}
.tabs div{padding:7px 16px;border-radius:18px;background:#0a6d62;color:#fff;font-size:14px}
.tabs div.active{background:#fff;color:#075e54;font-weight:700}
.chats{flex:1;overflow-y:auto}
.chat-item{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid #f5f5f5;align-items:center}
.chat-item img{width:50px;height:50px;border-radius:50%;background:#e9edef}
.info{flex:1}
.top{display:flex;justify-content:space-between}
.name{font-weight:700;font-size:16px}
.time{font-size:12px;color:#667781}
.last{font-size:13px;color:#667781;width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.add{position:fixed;bottom:20px;right:20px;width:60px;height:60px;background:#25d366;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:32px;box-shadow:0 4px 12px rgba(0,0,0,.3);cursor:pointer;z-index:5}
.bottom{height:65px;display:flex;justify-content:space-around;align-items:center;border-top:1px solid #eee;background:#fff}
.bottom div{text-align:center;font-size:11px;color:#667781}
.bottom div.active{color:#075e54;font-weight:600}
#win{position:fixed;inset:0;background:#e5ddd5;display:none;flex-direction:column;z-index:20}
#win header{background:#075e54;padding:12px;display:flex;gap:10px;align-items:center;color:#fff}
#win #msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:#0b141a url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png')}
.bubble{background:#fff;padding:8px 12px;border-radius:10px;max-width:75%;font-size:14px;align-self:flex-start;box-shadow:0 1px 1px rgba(0,0,0,.1)}
.bubble.me{background:#d9fdd3;align-self:flex-end}
#win #bar{display:flex;padding:8px;gap:8px;background:#f0f2f5;align-items:center}
#win input{flex:1;padding:12px 16px;border-radius:24px;border:none;outline:none;font-size:15px}
#win button{background:#25d366;border:none;width:48px;height:48px;border-radius:50%;color:#fff;font-size:20px}
</style>
</head>
<body>
<div class="h"><b>💬 SoloChat</b><span style="font-size:20px">⋮</span></div>
<div class="search">🔍 <input id="s" placeholder="Search SoloChat" oninput="filter()"></div>
<div class="tabs"><div class="active">All</div><div>Unread</div><div>Favorites</div><div>Groups</div><div>+</div></div>
<div class="chats" id="list"></div>
<div class="add" onclick="addContact()">+</div>
<div class="bottom">
<div class="active">💬<br>Chats</div><div>⭕<br>Updates</div><div>👥<br>Communities</div><div>📞<br>Calls</div><div>👤<br>You</div>
</div>
<div id="win">
<header><span onclick="closeWin()" style="font-size:28px;cursor:pointer">←</span><img id="wImg" style="width:38px;height:38px;border-radius:50%"><div id="wName" style="font-weight:700;font-size:16px"></div></header>
<div id="msgs"></div>
<div id="bar"><input id="inp" placeholder="Message in SoloChat"><button onclick="send()">➤</button></div>
</div>
<script>
let contacts=JSON.parse(localStorage.getItem('sb_contacts')||'[]');
if(contacts.length==0){
 contacts=[
  {name:'Amod',last:'Voice message (0:05)',time:'3:57 PM',img:'https://i.pravatar.cc/100?u=amod'},
  {name:'Brilliant ones',last:'Accept my invite & Win...',time:'3:20 PM',img:'https://i.pravatar.cc/100?u=brill'},
  {name:'School love 🌹',last:'APC Instant N40,000 Naira...',time:'12:01 PM',img:'https://i.pravatar.cc/100?u=school'},
  {name:'Monday James',last:'Just say am finished',time:'11:20 AM',img:'https://i.pravatar.cc/100?u=monday'},
  {name:'Mummy Prince',last:'Shabe I say I go pay you back',time:'9:10 AM',img:'https://i.pravatar.cc/100?u=mummy'}
 ]; save();
}
let current=null; let messages=JSON.parse(localStorage.getItem('sb_msgs')||'{}');
function save(){localStorage.setItem('sb_contacts',JSON.stringify(contacts)); localStorage.setItem('sb_msgs',JSON.stringify(messages)); render();}
function render(){
 let q=document.getElementById('s').value.toLowerCase(); let html='';
 contacts.filter(c=>c.name.toLowerCase().includes(q)).forEach((c,i)=>{
  html+=`<div class="chat-item" onclick="openChat(${i})"><img src="${c.img}"><div class="info"><div class="top"><div class="name">${c.name}</div><div class="time">${c.time}</div></div><div class="last">${c.last}</div></div></div>`;
 });
 document.getElementById('list').innerHTML=html;
}
function filter(){render();}
function addContact(){
 let name=prompt('Add contact name? Eg: Solomon'); if(!name) return;
 contacts.unshift({name,last:'Welcome to SoloChat! 💬',time:'now',img:`https://i.pravatar.cc/100?u=${name}${Date.now()}`});
 messages[name]=[]; save();
}
function openChat(i){current=contacts[i].name; document.getElementById('wName').innerText=current; document.getElementById('wImg').src=contacts[i].img; document.getElementById('win').style.display='flex'; renderMsgs();}
function closeWin(){document.getElementById('win').style.display='none';}
function renderMsgs(){let box=document.getElementById('msgs'); box.innerHTML=''; (messages[current]||[]).forEach(m=>{let d=document.createElement('div'); d.className='bubble'+(m.me?' me':''); d.innerText=m.t; box.appendChild(d);}); box.scrollTop=box.scrollHeight;}
function send(){let inp=document.getElementById('inp'); let t=inp.value.trim(); if(!t||!current) return; if(!messages[current]) messages[current]=[]; messages[current].push({t,me:true}); setTimeout(()=>{messages[current].push({t:'SoloChat: '+t,me:false}); save(); renderMsgs();},700); contacts.find(c=>c.name===current).last=t; contacts.find(c=>c.name===current).time='now'; inp.value=''; save(); renderMsgs(); render();}
render();
</script>
</body>
</html>
